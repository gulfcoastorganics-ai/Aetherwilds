name: Bootstrap canonical Aetherwilds V4.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap-v46.yml'
      - 'bootstrap/**'
      - 'SHA256SUMS.txt'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-v46:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect already-hydrated repository
        id: gate
        shell: bash
        run: |
          if [[ ! -f bootstrap/gamejs.part00.b64 ]]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "Bootstrap payload already removed; nothing to do."
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reconstruct canonical game.js
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat bootstrap/gamejs.part00.b64 bootstrap/gamejs.part01.b64 bootstrap/gamejs.part02.b64 \
            | base64 -d | gzip -dc > game.js
          echo '65b93d08507604c09801d480ec724ef8efe6f80978d33d249557061d52250117  game.js' | sha256sum -c -
          node --check game.js
          grep -q 'V4.6.0-depth-hardened' game.js

      - name: Fetch and verify canonical runtime art
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets
          bases=(
            'https://aetherwilds-v43.vercel.app'
            'https://aetherwilds-v43-6kn6nqs7v-gulfcoastorganics-ais-projects.vercel.app'
          )
          while read -r expected path; do
            [[ "$path" == ./assets/*.webp ]] || continue
            rel="${path#./}"
            tmp="${rel}.download"
            ok=0
            for base in "${bases[@]}"; do
              rm -f "$tmp"
              if curl --retry 3 --retry-delay 1 -fsSL "$base/$rel" -o "$tmp"; then
                actual="$(sha256sum "$tmp" | awk '{print $1}')"
                if [[ "$actual" == "$expected" ]]; then
                  mv "$tmp" "$rel"
                  echo "verified $rel"
                  ok=1
                  break
                fi
                echo "hash mismatch for $rel from $base: $actual" >&2
              fi
            done
            if [[ "$ok" != 1 ]]; then
              echo "Unable to retrieve exact canonical bytes for $rel" >&2
              exit 1
            fi
          done < SHA256SUMS.txt
          test "$(find assets -maxdepth 1 -type f -name '*.webp' | wc -l)" -eq 22

      - name: Verify canonical baseline
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          grep -E '  \./(assets/.*\.webp|game\.js|index\.html|styles\.css|vercel\.json)$' SHA256SUMS.txt | sha256sum -c -
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8'))"
          node --check game.js

      - name: Finalize canonical import
        if: steps.gate.outputs.run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -rf bootstrap
          rm -f .gitkeep
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
            exit 0
          fi
          git commit -m 'Import Aetherwilds V4.6 depth and occlusion hardened baseline'
          git push origin HEAD:main
